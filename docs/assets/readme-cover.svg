<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
<title id="title">AgentShield — Inspect. Simulate. Understand.</title>
<desc id="desc">A grayscale cover with a shield and two panels representing attack and defense. Skill review, system checks, and six simulated scenarios.</desc>
